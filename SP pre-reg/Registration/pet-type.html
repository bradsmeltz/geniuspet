<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/registration.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            beige: { lightest: '#FDFCFB', light: '#FBF8F4', medium: '#F2EAE4', warm: '#D19D61' },
            neutral: { light: '#AAAAAA', medium: '#747474', dark: '#464646', black: '#2B2B2B' },
            red: { primary: '#D74242', medium: '#C43C3C', dark: '#992F2F' },
            blue: { lightest: '#EFF6FA', light: '#7AB8D9', primary: '#3995C6', medium: '#3488B4', dark: '#286A8D' },
            teal: { primary: '#2e8a7b', dark: '#216257', tint: '#eaf3f2' },
            gold: { primary: '#d49d35', dark: '#8a6632', tint: '#f9f4ed' },
            green: { primary: '#297A6D', light: '#EAF3F2' },
          },
          fontFamily: { gilroy: ['Gilroy', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'] },
        },
      },

  <style>
    .progress-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .progress-dot.active {
      box-shadow: 0 0 0 4px rgba(215, 66, 66, 0.2);
    }
    .progress-connector {
      width: 20px;
      height: 2px;
      border-radius: 1px;
      transition: background 0.3s ease;
    }

    /* Pet type cards */
    .pet-type-card {
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }
    .pet-type-card:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .pet-type-card:active {
      transform: scale(0.97);
    }
    .pet-type-card.selected {
      border-color: #D19D61;
      background-color: #F6F1EA;
    }
    .pet-type-card:not(.selected) {
      border-color: #E3E3E3;
      background-color: white;
    }

    /* Checkmark badge */
    .check-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 24px;
      height: 24px;
      background: #D19D61;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .pet-type-card.selected .check-badge {
      transform: scale(1);
    }
  </style>
</head>

    <!-- Header -->

      <div class="px-5 py-4 flex items-center justify-between">
        <button type="button" id="backBtn" class="text-neutral-medium hover:text-neutral-dark transition-colors">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
          </svg>
        </button>
        <img src="https://geniuspet.com/geniuspet/home2/home2-logo.svg" alt="GeniusTag" class="h-8">
        <div class="w-6"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="px-5 py-6">

      <!-- Progress dots: 6 dots — dots 1-2 completed, dot 3 active, dots 4-6 upcoming -->
      <div class="flex items-center justify-center gap-0 mb-8 fade-in">
        <div class="progress-dot bg-red-primary"></div>
        <div class="progress-connector bg-red-primary"></div>
        <div class="progress-dot bg-red-primary"></div>
        <div class="progress-connector bg-red-primary"></div>
        <div class="progress-dot bg-red-primary active"></div>
        <div class="progress-connector bg-beige-medium"></div>
        <div class="progress-dot bg-beige-medium"></div>
        <div class="progress-connector bg-beige-medium"></div>
        <div class="progress-dot bg-beige-medium"></div>
        <div class="progress-connector bg-beige-medium"></div>
        <div class="progress-dot bg-beige-medium"></div>
      </div>

      <!-- Headline -->
      <div class="text-center mb-6 fade-in">
        <h1 class="text-[24px] font-bold leading-tight">Is <span class="pet-name">your pet</span> a dog or a cat?</h1>

  <script src="js/scoring.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    (function () {

      var cardDog   = document.getElementById('cardDog');
      var cardCat   = document.getElementById('cardCat');
      var backBtn   = document.getElementById('backBtn');

      var selectedType = null;

      /* Pre-fill from session — only show selection if previously chosen */
      var data = getPetData();
      if (data.petType) {
        selectedType = data.petType;
        updateCards();
      }

      function updateCards() {
        cardDog.classList.remove('selected');
        cardCat.classList.remove('selected');
        if (selectedType === 'dog') {
          cardDog.classList.add('selected');
        } else if (selectedType === 'cat') {
          cardCat.classList.add('selected');
        }
      }

      function selectAndAdvance(type) {
        selectedType = type;
        updateCards();
        savePetData({ petType: selectedType });
        setTimeout(function () {
          navigateTo('pet-breed.html');
        }, 350);
      }

      cardDog.addEventListener('click', function () {
        selectAndAdvance('dog');
      });

      cardCat.addEventListener('click', function () {
        selectAndAdvance('cat');
      });

      backBtn.addEventListener('click', function () {
        navigateTo('pet-name.html');
      });

    })();
  </script>
