<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your ESA's Name — GeniusPet</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/registration.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            beige: { lightest: '#FDFCFB', light: '#FBF8F4', medium: '#F2EAE4', warm: '#D19D61' },
            neutral: { light: '#AAAAAA', medium: '#747474', dark: '#464646', black: '#2B2B2B' },
            red: { primary: '#D74242', medium: '#C43C3C', dark: '#992F2F' },
            blue: { lightest: '#EFF6FA', light: '#7AB8D9', primary: '#3995C6', medium: '#3488B4', dark: '#286A8D' },
            teal: { primary: '#2e8a7b', dark: '#216257', tint: '#eaf3f2' },
            gold: { primary: '#d49d35', dark: '#8a6632', tint: '#f9f4ed' },
            green: { primary: '#297A6D', light: '#EAF3F2' },
          },
          fontFamily: { gilroy: ['Gilroy', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'] },
        },
      },
    }
  </script>
  <style>
    .progress-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .progress-dot.active {
      box-shadow: 0 0 0 4px rgba(215, 66, 66, 0.2);
    }
    .progress-connector {
      width: 20px;
      height: 2px;
      border-radius: 1px;
      transition: background 0.3s ease;
    }
  </style>
</head>
<body class="bg-beige-light font-gilroy text-neutral-black min-h-screen">
  <div class="max-w-[428px] mx-auto bg-beige-light min-h-screen relative">

    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-sm border-b border-beige-medium">
      <div class="px-5 py-4 flex items-center justify-between">
        <button type="button" id="backBtn" class="text-neutral-medium hover:text-neutral-dark transition-colors">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
          </svg>
        </button>
        <img src="https://geniuspet.com/geniuspet/home2/home2-logo.svg" alt="GeniusTag" class="h-8">
        <div class="w-6"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="px-5 py-6">

      <!-- Progress dots: 6 dots — dot 1 completed, dot 2 active, dots 3-6 upcoming -->
      <div class="flex items-center justify-center gap-0 mb-8 fade-in">
        <div class="progress-dot bg-red-primary"></div>
        <div class="progress-connector bg-red-primary"></div>
        <div class="progress-dot bg-red-primary active"></div>
        <div class="progress-connector bg-beige-medium"></div>
        <div class="progress-dot bg-beige-medium"></div>
        <div class="progress-connector bg-beige-medium"></div>
        <div class="progress-dot bg-beige-medium"></div>
        <div class="progress-connector bg-beige-medium"></div>
        <div class="progress-dot bg-beige-medium"></div>
        <div class="progress-connector bg-beige-medium"></div>
        <div class="progress-dot bg-beige-medium"></div>
      </div>

      <!-- Headline -->
      <div class="text-center mb-6 fade-in">
        <h1 class="text-[24px] font-bold leading-tight">What's your pet's name?</h1>
      </div>

      <!-- Name input -->
      <div class="mb-6 fade-in delay-1">
        <p class="text-base text-neutral-medium mb-3">We'll use this to personalize their Care ID.</p>
        <input
          type="text"
          id="nameInput"
          placeholder="e.g. Buddy, Luna, Max..."
          autocomplete="off"
          maxlength="30"
          class="reg-input"
          style="background-color: #fff; padding: 16px; font-size: 16px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);"
        >
        <!-- Live Care ID preview -->
        <div id="namePreview" class="mt-4 text-center transition-all duration-300 opacity-0 max-h-0 overflow-hidden">
          <span class="inline-flex items-center gap-1.5 bg-teal-tint text-teal-primary px-3 py-1.5 rounded-full text-base font-semibold">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/>
            </svg>
            <span id="previewText"></span>
          </span>
        </div>
      </div>

      <!-- Continue button -->
      <div class="mt-6">
        <button type="button" id="submitBtn" disabled class="btn-sticky cta-pulse-red w-full">Continue</button>
      </div>

    </main>
  </div>

  <script src="js/scoring.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    (function () {

      var nameInput   = document.getElementById('nameInput');
      var submitBtn   = document.getElementById('submitBtn');
      var backBtn     = document.getElementById('backBtn');
      var preview     = document.getElementById('namePreview');
      var previewText = document.getElementById('previewText');

      function capitalize(str) {
        if (!str) return '';
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function validate() {
        submitBtn.disabled = !nameInput.value.trim();
      }

      function updatePreview() {
        var name = capitalize(nameInput.value.trim());
        if (name) {
          previewText.textContent = name + '\u2019s Care ID';
          preview.classList.remove('opacity-0', 'max-h-0');
          preview.classList.add('opacity-100', 'max-h-20');
        } else {
          preview.classList.add('opacity-0', 'max-h-0');
          preview.classList.remove('opacity-100', 'max-h-20');
        }
      }

      nameInput.addEventListener('input', function () {
        validate();
        updatePreview();
      });

      nameInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !submitBtn.disabled) {
          submitBtn.click();
        }
      });

      /* Pre-fill from session */
      var existingName = getPetName();
      if (existingName) {
        nameInput.value = existingName;
      }
      validate();
      updatePreview();

      /* Back */
      backBtn.addEventListener('click', function () {
        navigateTo('gift-claim.html');
      });

      /* Submit */
      submitBtn.addEventListener('click', function () {
        if (submitBtn.disabled) return;
        var capitalizedName = capitalize(nameInput.value.trim());
        savePetData({ name: capitalizedName });
        navigateTo('pet-type.html');
      });

    })();
  </script>
</body>
</html>
